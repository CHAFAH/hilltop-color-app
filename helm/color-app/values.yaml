# Default values for color-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

namespace: color-app

replicaCount: 3

image:
  repository: 075120018043.dkr.ecr.us-east-1.amazonaws.com/color-app
  pullPolicy: IfNotPresent
  tag: "v1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "color-app"

podAnnotations: {}
podLabels: {}

lbService:
  port: 80
  targetPort: 8080
  annotations:
    type: "external"
    targetType: "ip"
    scheme: "internet-facing"

ingress:
  enabled: false

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

configmap:
  APP_COLOR: "blue"
  APP_ENV: "production"
  APP_MESSAGE: "Hello from Helm!"

secret:
  SECRET_KEY: "bXktc2VjcmV0LWtleQ=="   # base64 of: my-secret-key

volume:
  accessMode: ReadWriteOnce
  storageClass: gp2
  size: 1Gi

externalSecret:
  region: us-east-1
  serviceAccountName: eso-sa
  refreshInterval: 1m
  remoteKey: color-app/prod
  keys:
  - name: SECRET_KEY
  - name: DB_PASSWORD
  - name: API_KEY

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
