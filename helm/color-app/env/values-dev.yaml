namespace: develop

replicaCount: 1

image:
  repository: 075120018043.dkr.ecr.us-east-1.amazonaws.com/color-app
  pullPolicy: IfNotPresent
  tag: "v1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::075120018043:role/color-app-eso-role
  name: "color-app"

podAnnotations: {}
podLabels: {}

lbService:
  port: 80
  targetPort: 8080
  annotations:
    type: "external"
    targetType: "ip"
    scheme: "internet-facing"


resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

configmap:
  APP_COLOR: "green"
  APP_ENV: "development"
  APP_MESSAGE: "Hello from Dev!"


volume:
  accessMode: ReadWriteOnce
  storageClass: gp2
  size: 1Gi

externalSecret:
  region: us-east-1
  serviceAccountName: color-app-sa
  refreshInterval: 1m
  remoteKey: color-app/dev
  keys:
  - name: SECRET_KEY
  - name: DB_PASSWORD
  - name: API_KEY

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
