namespace: develop

replicaCount: 1

image:
  tag: "v1"

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

configmap:
  APP_COLOR: "green"
  APP_ENV: "development"
  APP_MESSAGE: "Hello from Dev!"

externalSecret:
  remoteKey: color-app/dev
