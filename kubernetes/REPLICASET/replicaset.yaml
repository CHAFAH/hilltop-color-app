apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: wandaprep-replicaset
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wandaprep
  template:
    metadata:
      labels:
        app: wandaprep
    spec:
      containers:
      - name: wandaprep-container
        image: chafah/wandaprep:v1.0
        ports:
        - containerPort: 8080
        env:
        - name: APP_COLOR
          valueFrom:
            configMapKeyRef:
              name: wandaprep-config
              key: APP_COLOR
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: wandaprep-config
              key: APP_ENV
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: wandaprep-config
              key: APP_MESSAGE
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: wandaprep-secret
              key: SECRET_KEY
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
