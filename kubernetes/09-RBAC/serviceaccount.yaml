# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A SERVICE ACCOUNT?
#   A ServiceAccount is an identity for a Pod. When a Pod makes API calls to
#   the Kubernetes API server or to AWS (via IRSA), it uses the ServiceAccount
#   to authenticate. Every namespace has a "default" ServiceAccount but best
#   practice is to create dedicated ones per application.
#
# USE CASE:
#   color-app needs to write logs to CloudWatch. On EKS, we annotate the
#   ServiceAccount with an IAM role ARN (IRSA). AWS then issues temporary
#   credentials to the Pod automatically — no static keys needed.
#
# USEFUL COMMANDS:
#   kubectl apply -f serviceaccount.yaml -n color-app
#   kubectl get serviceaccount -n color-app
#   kubectl describe serviceaccount color-app-sa -n color-app
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: color-app-sa
  namespace: color-app
  annotations:
    # Replace with the actual IRSA role ARN from terraform output: app_irsa_role_arn
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/color-app-cluster-dev-app-sa
  labels:
    app: color-app
