# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A SECRET?
#   A Secret stores sensitive data (passwords, tokens, keys) as base64-encoded
#   values. Unlike ConfigMaps, Secrets are stored separately and can be
#   encrypted at rest. Pods consume them as env vars or mounted files.
#
# USE CASE:
#   color-app needs a SECRET_KEY that must not appear in the container image
#   or ConfigMap. The Secret keeps it out of plain-sight config and lets
#   RBAC control which Pods and users can read it.
#
# HOW TO BASE64 ENCODE A VALUE:
#   echo -n 'my-secret-value' | base64
#
# HOW TO DECODE:
#   echo 'base64string' | base64 -d
#
# USEFUL COMMANDS:
#   kubectl apply -f secret.yaml -n color-app
#   kubectl get secret color-app-secret -n color-app
#   kubectl describe secret color-app-secret -n color-app
#   kubectl get secret color-app-secret -n color-app -o jsonpath='{.data.SECRET_KEY}' | base64 -d
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: color-app-secret
  namespace: color-app
type: Opaque
# Values are base64 encoded
# color-app-secret-2024  →  Y29sb3ItYXBwLXNlY3JldC0yMDI0
data:
  SECRET_KEY: Y29sb3ItYXBwLXNlY3JldC0yMDI0
  AWS_ACCESS_KEY_ID: QUNDRVNTX0tFWV9JRF9QTEFDRUJPTEQ=
  AWS_SECRET_ACCESS_KEY: QVDTX1NFQ1JFVF9BQ0NFU1NfS0VZX1BMQUNFSE9MRA==
