apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wandaprep-cluster-reader
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces", "pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets"]
  verbs: ["get", "list", "watch"]
