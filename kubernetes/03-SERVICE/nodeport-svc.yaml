# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A NODEPORT SERVICE?
#   NodePort exposes the service on a static port (30000–32767) on every
#   node in the cluster. Traffic hitting <NodeIP>:<nodePort> is forwarded
#   to the matching Pods.
#
# USE CASE:
#   You are running a local cluster (minikube, kubeadm) and want to access
#   color-app from your browser without a cloud load balancer.
#   Hit http://<node-ip>:31200 to reach the app.
#
# USEFUL COMMANDS:
#   kubectl apply -f nodeport-svc.yaml -n color-app
#   kubectl get svc color-app-nodeport-svc -n color-app
#   minikube service color-app-nodeport-svc -n color-app
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: color-app-nodeport-svc
  namespace: color-app
spec:
  selector:
    app: color-app
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8080
    nodePort: 31200
