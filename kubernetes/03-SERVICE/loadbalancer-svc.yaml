# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A LOADBALANCER SERVICE?
#   LoadBalancer provisions an external cloud load balancer (AWS ELB, GCP LB)
#   and assigns it a public IP or DNS name. Traffic is forwarded from the
#   load balancer to the matching Pods.
#
# USE CASE:
#   You want to expose color-app to the internet on EKS without setting up
#   an Ingress. The AWS Load Balancer Controller will provision a Network
#   Load Balancer automatically when this Service is applied.
#
# USEFUL COMMANDS:
#   kubectl apply -f loadbalancer-svc.yaml -n color-app
#   kubectl get svc color-app-lb-svc -n color-app
#   # Wait for EXTERNAL-IP to be assigned, then open it in your browser
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: color-app-lb-svc
  namespace: color-app
spec:
  selector:
    app: color-app
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
