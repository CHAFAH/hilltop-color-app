apiVersion: v1
kind: ConfigMap
metadata:
  name: wandaprep-file-config
data:
  app.properties: |
    APP_COLOR=blue
    APP_ENV=production
    APP_MESSAGE=Loaded from a mounted config file!
---
apiVersion: v1
kind: Pod
metadata:
  name: wandaprep-configmap-volume
  labels:
    app: wandaprep
spec:
  containers:
  - name: wandaprep-container
    image: chafah/wandaprep:v1.0
    ports:
    - containerPort: 8080
    volumeMounts:
    - name: config-volume
      mountPath: /usr/src/app/config
      readOnly: true
  volumes:
  - name: config-volume
    configMap:
      name: wandaprep-file-config
