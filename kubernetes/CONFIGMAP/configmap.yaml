apiVersion: v1
kind: ConfigMap
metadata:
  name: color-app-config
  namespace: color-app
data:
  # ── App config ──────────────────────────────────────────────────────────────
  # Change APP_COLOR to any CSS color (red, blue, green, #ff6600, etc.)
  # to demonstrate live ConfigMap updates in class
  APP_COLOR: "blue"
  APP_ENV: "production"
  APP_MESSAGE: "Welcome to the color-app Kubernetes Training!"

  # ── Logging config ──────────────────────────────────────────────────────────
  # LOG_LEVEL controls verbosity: debug | info | warn | error
  LOG_LEVEL: "info"
  AWS_REGION: "us-east-1"
  LOG_GROUP: "/color-app"
