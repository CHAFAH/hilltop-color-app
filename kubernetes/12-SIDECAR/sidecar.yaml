# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A SIDECAR?
#   A Sidecar is a second container running in the same Pod as the main app.
#   Both containers share the same network and can share volumes. The sidecar
#   extends or supports the main container without modifying its image.
#
# USE CASE:
#   color-app writes logs to /usr/src/app/logs/app.log. A log-shipper sidecar
#   tails that file and forwards each line to stdout (or a remote endpoint).
#   This keeps the main app simple — it just writes files — while the sidecar
#   handles log shipping. This is the pattern used by Fluent Bit on EKS.
#
# USEFUL COMMANDS:
#   kubectl apply -f sidecar.yaml -n color-app
#   kubectl get pods color-app-sidecar -n color-app
#   # Watch the main app logs:
#   kubectl logs color-app-sidecar -c color-app -n color-app
#   # Watch the sidecar shipper logs:
#   kubectl logs color-app-sidecar -c log-shipper -n color-app -f
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: color-app-sidecar
  namespace: color-app
  labels:
    app: color-app
spec:
  containers:

  # ── Main application container ────────────────────────────────────────────
  - name: color-app
    image: chafah/color-app:latest
    ports:
    - containerPort: 8080
    env:
    - name: APP_COLOR
      value: "purple"
    - name: APP_ENV
      value: "sidecar-demo"
    - name: APP_MESSAGE
      value: "Running with a log-shipper sidecar!"
    - name: SECRET_KEY
      value: "sidecar-demo"
    volumeMounts:
    - name: shared-logs
      mountPath: /usr/src/app/logs

  # ── Sidecar: tails the log file and ships each line to stdout ─────────────
  - name: log-shipper
    image: busybox:1.36
    command:
    - "sh"
    - "-c"
    - |
      echo "[SHIPPER] Waiting for app.log..."
      while [ ! -f /logs/app.log ]; do sleep 1; done
      echo "[SHIPPER] Tailing app.log"
      tail -f /logs/app.log | while read line; do
        echo "[SHIPPER] $(date -u +%Y-%m-%dT%H:%M:%SZ) $line"
      done
    volumeMounts:
    - name: shared-logs
      mountPath: /logs

  volumes:
  - name: shared-logs
    emptyDir: {}
