# LoadBalancer Service for the Deployment
# Apply this after deploy.yaml to expose color-app externally
apiVersion: v1
kind: Service
metadata:
  name: color-app-lb-svc
  namespace: color-app
spec:
  selector:
    app: color-app
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
