apiVersion: v1
kind: Pod
metadata:
  name: wandaprep-sidecar
  labels:
    app: wandaprep
spec:
  containers:

  # Main application container
  - name: wandaprep-app
    image: chafah/wandaprep:v1.0
    ports:
    - containerPort: 8080
    env:
    - name: APP_COLOR
      value: "purple"
    - name: APP_ENV
      value: "production"
    - name: APP_MESSAGE
      value: "Running with a sidecar log shipper!"
    - name: SECRET_KEY
      value: "sidecar-demo"
    volumeMounts:
    - name: shared-logs
      mountPath: /usr/src/app/logs

  # Sidecar container — reads logs written by the main app and ships them
  - name: log-shipper
    image: busybox:1.36
    command:
    - "sh"
    - "-c"
    - |
      echo "Log shipper started. Tailing app logs..."
      while [ ! -f /logs/app.log ]; do sleep 1; done
      tail -f /logs/app.log | while read line; do
        echo "[SHIPPER] $(date -u +%Y-%m-%dT%H:%M:%SZ) $line"
      done
    volumeMounts:
    - name: shared-logs
      mountPath: /logs

  volumes:
  - name: shared-logs
    emptyDir: {}
