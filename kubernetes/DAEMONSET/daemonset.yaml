apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wandaprep-log-collector
  labels:
    app: wandaprep-log-collector
spec:
  selector:
    matchLabels:
      app: wandaprep-log-collector
  template:
    metadata:
      labels:
        app: wandaprep-log-collector
    spec:
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: log-collector
        image: busybox:1.36
        command: ["sh", "-c", "while true; do echo \"[$(date)] Node log collector running on $(hostname)\"; sleep 30; done"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
