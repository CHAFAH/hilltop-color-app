# ─────────────────────────────────────────────────────────────────────────────
# WHAT IS A SECRET VOLUME?
#   A Secret can be mounted as a volume so its values appear as files inside
#   the container. The files are stored in a tmpfs (in-memory) mount so they
#   never touch the node's disk.
#
# USE CASE:
#   TLS certificates, SSH keys, and API tokens are often expected as files
#   by applications. Mounting a Secret as a volume is safer than env vars
#   because the values don't appear in kubectl describe pod output.
#
# USEFUL COMMANDS:
#   kubectl apply -f secret-volume.yaml -n color-app
#   kubectl exec -it color-app-secret-vol -n color-app -- sh
#   # Inside the pod:
#   ls /usr/src/app/secrets
#   cat /usr/src/app/secrets/SECRET_KEY
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: color-app-secret-vol
  namespace: color-app
  labels:
    app: color-app
spec:
  containers:
  - name: color-app
    image: chafah/color-app:latest
    ports:
    - containerPort: 8080
    env:
    - name: APP_COLOR
      value: "teal"
    - name: APP_ENV
      value: "secret-vol-demo"
    - name: APP_MESSAGE
      value: "Secret mounted as a file!"
    - name: SECRET_KEY
      value: "from-env"
    volumeMounts:
    - name: secret-volume
      mountPath: /usr/src/app/secrets
      readOnly: true
  volumes:
  - name: secret-volume
    secret:
      secretName: color-app-secret
