apiVersion: v1
kind: Secret
metadata:
  name: color-app-secret
  namespace: color-app
type: Opaque
# All values must be base64 encoded: echo -n 'value' | base64
data:
  # App secret — used to demonstrate Secret injection in class
  # Decoded value: color-app-secret-2024
  SECRET_KEY: Y29sb3ItYXBwLXNlY3JldC0yMDI0

  # AWS credentials for CloudWatch — only needed when NOT using IRSA
  # On EKS with IRSA configured, leave these as placeholder values
  # Decoded placeholders shown below — replace with real base64-encoded values
  # echo -n 'AKIAIOSFODNN7EXAMPLE' | base64
  AWS_ACCESS_KEY_ID: QUNDRVNTX0tFWV9JRF9QTEFDRUJPTEQ=
  # echo -n 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY' | base64
  AWS_SECRET_ACCESS_KEY: QVDTX1NFQ1JFVF9BQ0NFU1NfS0VZX1BMQUNFSE9MRA==
